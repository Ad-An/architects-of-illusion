<!DOCTYPE html>
<html lang="en" class="dark h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architects of Illusion — A VFX & 3D Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      /* ------------------------------------------------------------- */
      /*  BACKGROUND IMAGE VARIABLE — Your local synthwave image       */
      /* ------------------------------------------------------------- */
      --bg-image-url: url('2IT proj I.jpg');
      
      /* ACCENT GLOW COLORS */
      --vfx-glow: rgba(245, 158, 11, 0.35);
      --blender-glow: rgba(234, 88, 12, 0.25);
    }

    /* Fullscreen custom background overlay */
    .hero-bg {
      background-image: 
        linear-gradient(to bottom, rgba(10, 15, 29, 0.45), rgba(10, 15, 29, 0.75)),
        var(--bg-image-url);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vfxGold: '#f59e0b',
            blenderOrange: '#ea580c',
            viewportDark: '#0a0f1d',
          }
        }
      }
    }
  </script>
</head>
<body class="hero-bg text-slate-100 font-sans antialiased h-screen w-screen overflow-hidden flex flex-col justify-between items-center relative select-none">

  <!-- Ambient Glow Background Orbs -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[140px] pointer-events-none"></div>
  <div class="absolute bottom-10 left-1/3 w-[350px] h-[350px] bg-orange-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- TOP BRAND HEADER -->
  <header class="pt-8 text-center z-10">
    <p class="text-xs uppercase tracking-[0.3em] text-slate-300 font-medium drop-shadow">Visual Effects & 3D Animation Logs</p>
  </header>

  <!-- CENTER HERO CONTENT -->
  <main class="text-center px-6 max-w-3xl z-10 my-auto">
    
    <!-- Title with soft glow -->
    <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight text-white mb-4 drop-shadow-[0_0_25px_rgba(245,158,11,0.4)]">
      Architects of <span class="bg-gradient-to-r from-amber-300 via-vfxGold to-amber-500 bg-clip-text text-transparent">Illusion</span>
    </h1>

    <!-- Subtitle -->
    <p class="text-slate-200 text-base md:text-xl max-w-2xl mx-auto font-light leading-relaxed mb-10 drop-shadow">
      Deconstructing movie magic across history & documenting 3D experiments in Blender.
    </p>

    <!-- HERO BUTTONS -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-5">
      <!-- Primary CTA: VFX History -->
      <a href="vfx-history.html" 
         class="w-full sm:w-auto px-8 py-3.5 rounded-xl text-sm font-bold text-slate-950 bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 shadow-[0_0_25px_var(--vfx-glow)] hover:shadow-[0_0_35px_rgba(245,158,11,0.6)] hover:scale-105 transition-all duration-300 border border-amber-300/30">
        VFX History
      </a>
      
      <!-- Secondary CTA: Blender Lab -->
      <a href="blender-lab.html" 
         class="w-full sm:w-auto px-8 py-3.5 rounded-xl text-sm font-semibold text-slate-100 border border-slate-600/80 bg-slate-900/70 backdrop-blur-md hover:border-orange-500/50 hover:text-orange-400 hover:bg-orange-500/20 transition-all duration-300">
        Blender Lab
      </a>
    </div>

  </main>

  <!-- FOOTER / AUTHOR -->
  <footer class="pb-8 text-center z-10">
    <p class="text-xs text-slate-400 tracking-widest font-semibold uppercase drop-shadow">By Adhirath</p>
  </footer>

  <!-- SHARED LENS SHADER ENGINE -->
  <script src="lens.js"></script>
</body>
</html>
